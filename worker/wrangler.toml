name = "pregnancy-ai"
main = "src/index.mjs"
compatibility_date = "2024-11-01"

# Cloudflare Workers AI — a FREE, no-extra-key fallback provider used when the
# Gemini free-tier quota is exhausted (see cfFallback* in src/index.mjs).
[ai]
binding = "AI"

# Public config. Not secrets.
[vars]
FIREBASE_PROJECT_ID = "pregnancy-companion-ad7b7"
# MODEL = "gemini-flash-latest"   # optional; defaults to gemini-flash-latest (a
                                  # free-tier alias that tracks the current Flash model).
                                  # Other free option seen on this key: gemini-flash-lite-latest

# The Gemini API key is a SECRET — do NOT put it here. Set it once with:
#   wrangler secret put GEMINI_API_KEY
